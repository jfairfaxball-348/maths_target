name: programme-integrity
on:
  push:
    branches: [main, "s000/**", "s001/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
